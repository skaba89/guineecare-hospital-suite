# Render Blueprint — GuinéeCare Hospital Suite (Render + Neon)
#
# Déploiement GRATUIT :
# - Render : backend FastAPI + frontend statique (1 service, 1 URL)
# - Neon : PostgreSQL serverless (gratuit, permanent, 0.5 GB)
#
# Usage :
# 1. Créez une DB sur https://neon.tech (gratuit, GitHub login)
# 2. Copiez l'URL de connexion Neon (Pooled connection)
# 3. Sur https://render.com → New → Blueprint → sélectionnez ce repo
# 4. Configurez DATABASE_URL et AUTH_SECRET dans le dashboard Render

services:
  - type: web
    name: guineecare
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && cd ../frontend && npm ci && npm run build && cp -r dist ../backend/static
    startCommand: bash render_start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: PYTHON_VERSION
        value: "3.12.0"
