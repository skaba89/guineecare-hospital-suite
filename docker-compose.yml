services:
  backend:
    build:
      context: ./backend
    container_name: guineecare-backend
    command: sh -c "python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
      - DATABASE_URL=postgresql://guineecare:guineecare@postgres:5432/guineecare
      - AUTH_SECRET=local-dev-secret
      - TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    container_name: guineecare-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: guineecare-postgres
    environment:
      - POSTGRES_DB=guineecare
      - POSTGRES_USER=guineecare
      - POSTGRES_PASSWORD=guineecare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guineecare -d guineecare"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
