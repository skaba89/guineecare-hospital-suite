name: load-test

# Nightly load test with Locust — 20 users for 30s against a fresh dev backend.
# The goal is to catch performance regressions early, not to test capacity.

on:
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locust:
    name: Locust load test (20 users, 30s)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend deps + locust
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust

      - name: Start backend (SQLite, seeded, no rate-limit)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./load_test.db"
          AUTH_SECRET: "load-test-secret-2025"
          ENVIRONMENT: "local"
          SEED_DEMO_DATA: "true"
          CORS_ORIGINS: '["*"]'
        run: |
          rm -f load_test.db
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/backend.pid
          # Wait for /health/ready to return 200
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health/ready || (echo "Backend not ready" && exit 1)

      - name: Run Locust headless (20 users, 5/s spawn, 30s)
        working-directory: load_tests
        run: |
          mkdir -p results
          locust -f locustfile.py \
            --host http://127.0.0.1:8000 \
            --headless \
            -u 20 -r 5 -t 30s \
            --csv results/locust_report \
            --only-summary \
            --html results/report.html

      - name: Print stats
        if: always()
        working-directory: load_tests
        run: |
          echo "## Locust Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f results/locust_report_stats.csv ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat results/locust_report_stats.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No stats file produced (test may have failed)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Locust report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: |
            load_tests/results/
          retention-days: 14

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) 2>/dev/null || true
          fi
