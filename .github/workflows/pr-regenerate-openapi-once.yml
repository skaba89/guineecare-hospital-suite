name: pr-regenerate-openapi-once

on:
  push:
    branches:
      - agent/national-multicountry-foundation
    paths:
      - .github/workflows/pr-regenerate-openapi-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/national-multicountry-foundation

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate versioned API artifacts
        env:
          DATABASE_URL: sqlite:///./test_guineecare.db
          AUTH_SECRET: test-secret-key-ci
          ENVIRONMENT: test
        run: python scripts/generate_openapi_artifacts.py

      - name: Commit generated artifacts when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json docs/api/guineecare.postman_collection.json docs/api/guineecare-local.postman_environment.json
          if git diff --cached --quiet; then
            echo "No generated API drift."
            exit 0
          fi
          git commit -m "docs: regenerate OpenAPI artifacts"
          git push origin HEAD:agent/national-multicountry-foundation
