name: p0-security-jwt-logout-fix-once

on:
  push:
    branches:
      - agent/p0-security-dependency-baseline
    paths:
      - .github/workflows/p0-security-jwt-logout-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-security-dependency-baseline

      - name: Complete logout migration to PyJWT
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/modules/auth/routes.py')
          text = path.read_text(encoding='utf-8')
          old_import = '            from jose import JWTError\n'
          old_except = '        except JWTError:\n'
          if text.count(old_import) != 1 or text.count(old_except) != 1:
              raise SystemExit('Unexpected legacy JWTError pattern; refusing broad edit')
          text = text.replace(old_import, '            import jwt\n', 1)
          text = text.replace(old_except, '        except jwt.InvalidTokenError:\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run focused regression tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_guineecare.db
          AUTH_SECRET: test-secret-key-ci
          ENVIRONMENT: test
          CORS_ORIGINS: '["*"]'
        run: |
          pytest -q --tb=short \
            tests/test_security_v09.py::TestJtiBlacklistIntegration::test_logout_with_access_token_revokes_jti \
            tests/test_deployment_artifacts.py::test_gitignore_excludes_secrets \
            tests/test_security_jwt.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/auth/routes.py
          git commit -m "security: finish PyJWT logout migration"
          git push origin HEAD:agent/p0-security-dependency-baseline
