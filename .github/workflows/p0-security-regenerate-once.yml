name: p0-security-regenerate-once

on:
  push:
    branches:
      - agent/p0-security-dependency-baseline
    paths:
      - .github/workflows/p0-security-regenerate-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-security-dependency-baseline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh frontend lockfile without breaking upgrades
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend dependency resolution
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate API artifacts
        env:
          DATABASE_URL: sqlite:///./test_guineecare.db
          AUTH_SECRET: test-secret-key-ci
          ENVIRONMENT: test
        run: python scripts/generate_openapi_artifacts.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/package.json docs/api/openapi.json docs/api/guineecare.postman_collection.json docs/api/guineecare-local.postman_environment.json
          if git diff --cached --quiet; then
            echo "No generated drift."
            exit 0
          fi
          git commit -m "chore: refresh security dependency artifacts"
          git pull --rebase origin agent/p0-security-dependency-baseline
          git push origin HEAD:agent/p0-security-dependency-baseline

# rerun after PyJWT compatibility migration
