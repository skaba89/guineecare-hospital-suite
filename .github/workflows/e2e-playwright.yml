name: e2e-playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend with seed data
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./dev_guineecare.db
          AUTH_SECRET: ci-secret-key-2025
          ENVIRONMENT: local
          SEED_DEMO_DATA: "true"
          CORS_ORIGINS: '["*"]'
        run: |
          rm -f dev_guineecare.db
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          for i in $(seq 1 90); do
            if curl -s http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done

          if ! curl -s http://127.0.0.1:8000/health > /dev/null 2>&1; then
            echo "Backend failed to start"
            cat /tmp/backend.log
            exit 1
          fi

      - name: Prepare deterministic E2E role fixtures
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./dev_guineecare.db
          AUTH_SECRET: ci-secret-key-2025
          ENVIRONMENT: local
          PYTHONPATH: .
        run: python scripts/prepare_e2e_users.py

      - name: Verify backend health and seed
        run: |
          curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          TOKEN=$(curl -s -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@guineecare.com","password":"admin123"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "Failed to login as SUPER_ADMIN"
            exit 1
          fi
          echo "Shard ${{ matrix.shard }}/4 seed verified"

      - name: Run Playwright tests — shard ${{ matrix.shard }}/4
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=github

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "=== Backend logs (last 150 lines) — shard ${{ matrix.shard }}/4 ==="
          tail -150 /tmp/backend.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) 2>/dev/null || true
          fi

  e2e-summary:
    name: E2E summary
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Require every Playwright shard to pass
        run: |
          echo "Matrix result: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"
