# Configuration nginx pour le conteneur frontend GuinéeCare.
# Servir le build Vite (SPA) — try_files pour le routing client-side.
# Cache long pour les assets hashed, no-cache pour index.html.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sécurité de base
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip pour les assets texte
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # SPA routing : tout passe par index.html sauf les fichiers statiques
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite (hashés dans le nom) — cache 1 an immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html — jamais de cache (sinon les mises à jour SPA ne se propagent pas)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Favicon et fichiers statiques à la racine
    location ~* \.(ico|png|svg|webmanifest)$ {
        expires 7d;
        access_log off;
    }
}
